[package]
name = "sim-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for the TritForge balanced ternary simulator"
repository = "https://github.com/heisuo/tritforge"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
sim-core = { path = "../sim-core" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
