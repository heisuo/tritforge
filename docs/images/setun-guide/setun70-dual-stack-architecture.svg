<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850">
  <title>Setun-70 双栈功能体系结构</title>
  <desc>以教学功能图展示 Setun-70 的 6-trit 程序单位、18-trit 操作数栈、独立返回地址栈、三个页寄存器、9 页操作存储器与 I/O 边界。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      letter-spacing: 0;
      fill: #17252d;
    }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #53666f; }
    .section { font-size: 18px; font-weight: 700; }
    .card-title { font-size: 17px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .body { font-size: 14px; fill: #344b56; }
    .small { font-size: 12px; fill: #5a6d75; }
    .formula { font-size: 22px; font-weight: 700; }
    .center { text-anchor: middle; }
    .inverse { fill: #ffffff; }
    .line { fill: none; stroke: #667b84; stroke-width: 2; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="dual-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667b84"/>
    </marker>
    <marker id="dual-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b54c34"/>
    </marker>
  </defs>
  <text x="54" y="48" class="title">Setun-70：双栈功能体系结构</text>
  <text x="54" y="76" class="subtitle">6-trit tryte 是程序单位与最小可寻址单位；18-trit 操作数在算术栈中流动</text>

  <rect x="55" y="108" width="255" height="124" rx="6" fill="#eaf3f8" stroke="#26729c" stroke-width="2"/>
  <text x="182" y="140" class="section center" fill="#195c7f">PC / current tryte</text>
  <text x="182" y="174" class="formula center">6 trits</text>
  <text x="182" y="204" class="body center">当前程序单元与地址</text>

  <rect x="365" y="108" width="275" height="164" rx="6" fill="#fff8e8" stroke="#b57a1f" stroke-width="2"/>
  <text x="502" y="140" class="section center" fill="#8d5a12">分类</text>
  <text x="502" y="174" class="card-title center">operation / reference</text>
  <text x="502" y="204" class="body center">操作类或引用类 tryte</text>
  <text x="502" y="226" class="small center">81 operations: 27 basic + 27 auxiliary</text>
  <text x="502" y="244" class="small center">+ 27 user-programmable</text>
  <text x="502" y="262" class="small center">common summary; not an exact opcode table</text>

  <rect x="695" y="88" width="255" height="164" rx="6" fill="#eef7f1" stroke="#3f7e59" stroke-width="2"/>
  <text x="822" y="120" class="section center" fill="#2f6848">3 page registers</text>
  <rect x="720" y="140" width="62" height="56" rx="4" fill="#ffffff" stroke="#3f7e59"/>
  <rect x="792" y="140" width="62" height="56" rx="4" fill="#ffffff" stroke="#3f7e59"/>
  <rect x="864" y="140" width="62" height="56" rx="4" fill="#ffffff" stroke="#3f7e59"/>
  <text x="751" y="164" class="label center">-1</text><text x="751" y="185" class="small center">page</text>
  <text x="823" y="164" class="label center">0</text><text x="823" y="185" class="small center">page</text>
  <text x="895" y="164" class="label center">+1</text><text x="895" y="185" class="small center">page</text>
  <text x="822" y="230" class="small center">three selectors into one address space</text>

  <rect x="1005" y="88" width="390" height="258" rx="6" fill="#f7fbfd" stroke="#26729c" stroke-width="2"/>
  <text x="1200" y="120" class="section center" fill="#195c7f">operating memory</text>
  <text x="1200" y="145" class="body center">9 pages × 81 trytes</text>
  <rect x="1030" y="164" width="110" height="48" fill="#dceef6" stroke="#26729c"/><rect x="1150" y="164" width="110" height="48" fill="#dceef6" stroke="#26729c"/><rect x="1270" y="164" width="100" height="48" fill="#dceef6" stroke="#26729c"/>
  <rect x="1030" y="224" width="110" height="48" fill="#e5f2e9" stroke="#3f7e59"/><rect x="1150" y="224" width="110" height="48" fill="#e5f2e9" stroke="#3f7e59"/><rect x="1270" y="224" width="100" height="48" fill="#e5f2e9" stroke="#3f7e59"/>
  <rect x="1030" y="284" width="110" height="38" fill="#fff0eb" stroke="#b54c34"/><rect x="1150" y="284" width="110" height="38" fill="#fff0eb" stroke="#b54c34"/><rect x="1270" y="284" width="100" height="38" fill="#fff0eb" stroke="#b54c34"/>
  <text x="1085" y="194" class="label center">P0</text><text x="1205" y="194" class="label center">P1</text><text x="1320" y="194" class="label center">P2</text>
  <text x="1085" y="254" class="label center">P3</text><text x="1205" y="254" class="label center">P4</text><text x="1320" y="254" class="label center">P5</text>
  <text x="1085" y="309" class="label center">P6</text><text x="1205" y="309" class="label center">P7</text><text x="1320" y="309" class="label center">P8</text>

  <line x1="310" y1="170" x2="365" y2="170" class="line" marker-end="url(#dual-arrow)"/>
  <line x1="640" y1="170" x2="695" y2="170" class="line" marker-end="url(#dual-arrow)"/>
  <line x1="950" y1="170" x2="1005" y2="170" class="line" marker-end="url(#dual-arrow)"/>
  <text x="337" y="158" class="small center">fetch</text><text x="667" y="158" class="small center">select</text><text x="977" y="158" class="small center">open page</text>

  <rect x="55" y="388" width="430" height="232" rx="6" fill="#f8f5fa" stroke="#77558b" stroke-width="2"/>
  <text x="270" y="422" class="section center" fill="#60446f">operand stack</text>
  <text x="270" y="447" class="small center">概念可见项，不表示物理深度</text>
  <rect x="82" y="472" width="176" height="72" rx="5" fill="#77558b"/><text x="170" y="502" class="label inverse center">T · top</text><text x="170" y="526" class="body inverse center">18-trit operand</text>
  <rect x="278" y="472" width="176" height="72" rx="5" fill="#9b82aa"/><text x="366" y="502" class="label inverse center">S · second</text><text x="366" y="526" class="body inverse center">18-trit operand</text>
  <text x="270" y="580" class="card-title center">… deeper entries …</text>

  <rect x="545" y="388" width="305" height="232" rx="6" fill="#fff8e8" stroke="#b57a1f" stroke-width="2"/>
  <text x="697" y="424" class="section center" fill="#8d5a12">ALU / processor registers</text>
  <rect x="580" y="458" width="235" height="62" rx="5" fill="#ffffff" stroke="#b57a1f"/><text x="697" y="485" class="card-title center">18-trit arithmetic path</text><text x="697" y="507" class="small center">linked to T and S</text>
  <text x="697" y="558" class="body center">operate · compare · form result</text>

  <rect x="910" y="388" width="305" height="232" rx="6" fill="#fff2ee" stroke="#b54c34" stroke-width="2"/>
  <text x="1062" y="424" class="section center" fill="#913621">return / system stack</text>
  <rect x="945" y="458" width="235" height="62" rx="5" fill="#ffffff" stroke="#b54c34"/><text x="1062" y="485" class="card-title center">return addresses</text><text x="1062" y="507" class="small center">procedure / control transfer</text>
  <text x="1062" y="558" class="body center">separate from operand values</text>

  <rect x="1270" y="388" width="125" height="232" rx="6" fill="#eef3f5" stroke="#667b84" stroke-width="2"/>
  <text x="1332" y="424" class="section center">I/O</text>
  <text x="1332" y="470" class="body center">输入</text><text x="1332" y="496" class="body center">输出</text><text x="1332" y="548" class="small center">boundary</text>

  <line x1="697" y1="388" x2="697" y2="252" class="line" marker-end="url(#dual-arrow)"/>
  <line x1="485" y1="504" x2="545" y2="504" class="line" marker-end="url(#dual-arrow)"/><line x1="545" y1="548" x2="485" y2="548" class="line" marker-end="url(#dual-arrow)"/>
  <line x1="850" y1="446" x2="910" y2="446" stroke="#b54c34" stroke-width="2" marker-end="url(#dual-control)"/><line x1="910" y1="526" x2="850" y2="526" stroke="#b54c34" stroke-width="2" marker-end="url(#dual-control)"/>
  <path d="M 850 580 H 870 V 646 H 1250 V 566 H 1270" class="line" marker-end="url(#dual-arrow)"/>
  <text x="515" y="492" class="small center">T/S</text><text x="515" y="568" class="small center">result</text><text x="880" y="434" class="small center">call</text><text x="880" y="548" class="small center">return</text><text x="1060" y="638" class="small center">I/O control / data</text>

  <rect x="55" y="674" width="1340" height="112" rx="6" fill="#263b44"/>
  <circle cx="92" cy="710" r="19" fill="#26729c"/><text x="92" y="718" class="label inverse center">1</text><text x="130" y="716" class="label inverse">fetch tryte</text><text x="130" y="740" class="small inverse">PC 指向并取出当前 6-trit tryte</text>
  <circle cx="532" cy="710" r="19" fill="#b57a1f"/><text x="532" y="718" class="label inverse center">2</text><text x="570" y="716" class="label inverse">operate / reference</text><text x="570" y="740" class="small inverse">执行操作，或将 1–3 tryte word 送入操作数栈</text>
  <circle cx="1010" cy="710" r="19" fill="#b54c34"/><text x="1010" y="718" class="label inverse center">3</text><text x="1048" y="716" class="label inverse">update stack / control</text><text x="1048" y="740" class="small inverse">更新 T/S 与 PC；过程转移使用返回地址栈</text>
  <text x="725" y="774" class="small inverse center">教学用功能图：用于解释数据与控制关系，不是物理布线图。</text>
</svg>
