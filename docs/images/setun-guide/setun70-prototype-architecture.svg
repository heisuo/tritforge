<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1120" viewBox="0 0 1660 1120">
  <title>Setun-70 实验原型历史功能体系结构</title>
  <desc>依据历史总体特性资料重绘 Setun-70 实验原型的一级内部存储器、控制装置、操作装置、RAM 页操作数栈、控制上下文栈、二级磁鼓存储器和三路输入输出通道。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      letter-spacing: 0;
      fill: #17252d;
    }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #53666f; }
    .section { font-size: 18px; font-weight: 700; }
    .card-title { font-size: 17px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .body { font-size: 14px; fill: #344b56; }
    .small { font-size: 12px; fill: #5a6d75; }
    .formula { font-size: 22px; font-weight: 700; }
    .center { text-anchor: middle; }
    .inverse { fill: #ffffff; }
    .line { fill: none; stroke: #667b84; stroke-width: 2; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="proto-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667b84"/>
    </marker>
    <marker id="proto-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b54c34"/>
    </marker>
    <marker id="proto-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26729c"/>
    </marker>
  </defs>
  <text x="48" y="47" class="title">Setun-70 实验原型：历史功能体系结构</text>
  <text x="48" y="76" class="subtitle">依据《Setun-70 总体特性》重绘；展示体系结构可见的部件与信息流，不推断门级或物理布线</text>
  <rect x="1380" y="33" width="230" height="48" rx="5" fill="#fff8e8" stroke="#b57a1f"/>
  <line x1="1398" y1="50" x2="1430" y2="50" stroke="#667b84" stroke-width="3"/>
  <text x="1442" y="55" class="small">原型实装 / 史料确认</text>
  <line x1="1398" y1="68" x2="1430" y2="68" stroke="#667b84" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1442" y="73" class="small">体系预留扩展</text>

  <!-- Level-one internal memory -->
  <rect x="45" y="108" width="415" height="650" rx="6" fill="#f7fbfd" stroke="#26729c" stroke-width="3"/>
  <rect x="45" y="108" width="415" height="58" rx="6" fill="#26729c"/>
  <text x="252" y="144" class="section inverse center">一级内部存储器 m</text>

  <rect x="70" y="187" width="165" height="122" rx="5" fill="#dceef6" stroke="#26729c" stroke-width="2"/>
  <text x="152" y="216" class="card-title center" fill="#195c7f">RAM</text>
  <text x="152" y="247" class="formula center">9 pages</text>
  <text x="152" y="274" class="body center">页号 -4 … +4</text>
  <text x="152" y="296" class="small center">可由处理器 / I/O / f 写入</text>

  <rect x="250" y="187" width="185" height="122" rx="5" fill="#eef3f5" stroke="#667b84" stroke-width="2"/>
  <text x="342" y="216" class="card-title center">ROM</text>
  <text x="342" y="247" class="formula center">18 pages</text>
  <text x="342" y="274" class="body center">固定程序与过程</text>
  <text x="342" y="296" class="small center">只读</text>

  <rect x="70" y="327" width="365" height="68" rx="5" fill="#ffffff" stroke="#9fb6c0"/>
  <text x="252" y="354" class="label center">统一页号：-13 … +13</text>
  <text x="252" y="379" class="body center">每页 81 个可寻址 6-trit tryte（-40 … +40）</text>

  <rect x="70" y="413" width="365" height="147" rx="5" fill="#eef7f1" stroke="#3f7e59" stroke-width="2"/>
  <text x="252" y="441" class="card-title center" fill="#2f6848">地址从哪里来</text>
  <text x="92" y="474" class="label mono">page</text>
  <text x="157" y="474" class="body mono">h[-1] / h[0] / h[+1] / hf / ph / ch</text>
  <text x="92" y="510" class="label mono">cell</text>
  <text x="157" y="510" class="body mono">k / pa / ca</text>
  <text x="252" y="541" class="small center">先选页，再选页内 tryte</text>

  <rect x="70" y="578" width="365" height="154" rx="5" fill="#ffffff" stroke="#9fb6c0"/>
  <text x="252" y="607" class="card-title center">读写出口</text>
  <text x="92" y="639" class="body">读：处理器、I/O 通道或二级存储器</text>
  <text x="92" y="671" class="body">写：处理器、I/O 通道或二级存储器 → RAM</text>
  <rect x="92" y="692" width="320" height="24" rx="3" fill="#eaf3f8"/>
  <text x="252" y="709" class="small center">程序、数据与栈页共用这套内部存储结构</text>

  <!-- Processor boundary -->
  <rect x="500" y="108" width="1115" height="650" rx="6" fill="#fcfaf5" stroke="#b57a1f" stroke-width="3"/>
  <rect x="500" y="108" width="1115" height="58" rx="6" fill="#b57a1f"/>
  <text x="1057" y="144" class="section inverse center">处理器 = 控制装置 UU + 操作装置 OU</text>

  <!-- Control unit -->
  <rect x="525" y="185" width="475" height="548" rx="6" fill="#fff7f4" stroke="#b54c34" stroke-width="2"/>
  <text x="762" y="216" class="section center" fill="#913621">控制装置 UU</text>

  <rect x="550" y="235" width="425" height="100" rx="5" fill="#ffffff" stroke="#b54c34"/>
  <text x="570" y="263" class="card-title mono">k · 6 trits</text>
  <text x="570" y="289" class="body">当前命令 / 地址或操作 tryte</text>
  <rect x="570" y="303" width="170" height="20" rx="3" fill="#fff0eb"/>
  <text x="655" y="318" class="small mono center">k[1:2] = 00 → 操作</text>
  <rect x="752" y="303" width="203" height="20" rx="3" fill="#eef7f1"/>
  <text x="853" y="318" class="small mono center">k[1:2] ≠ 00 → 引用</text>

  <rect x="550" y="351" width="425" height="135" rx="5" fill="#ffffff" stroke="#b54c34"/>
  <text x="570" y="379" class="card-title mono">c · 32 trits total</text>
  <text x="570" y="404" class="body mono">c[1:8] = c1 · ch · ca</text>
  <text x="570" y="428" class="small">ch + ca 构成完整程序位置；顺序执行时 ca 递增</text>
  <rect x="754" y="444" width="48" height="26" fill="#fff0eb" stroke="#b54c34"/>
  <rect x="804" y="444" width="72" height="26" fill="#fff0eb" stroke="#b54c34"/>
  <rect x="878" y="444" width="72" height="26" fill="#fff0eb" stroke="#b54c34"/>
  <text x="778" y="462" class="small mono center">c[1:8]</text>
  <text x="840" y="462" class="small mono center">cb</text>
  <text x="914" y="462" class="small mono center">cc</text>
  <text x="570" y="463" class="small">stack: 8 / 12 / 12 trits</text>

  <rect x="550" y="502" width="425" height="91" rx="5" fill="#ffffff" stroke="#b54c34"/>
  <text x="570" y="530" class="card-title mono">p · 10 trits</text>
  <text x="570" y="556" class="body mono">ph: stack page · pa: top pointer</text>
  <text x="570" y="579" class="small mono">pb: interrupt context save</text>

  <rect x="550" y="609" width="425" height="61" rx="5" fill="#eef7f1" stroke="#3f7e59"/>
  <text x="570" y="636" class="card-title mono">h[-1], h[0], h[+1]</text>
  <text x="570" y="657" class="small">三个操作数页分配寄存器；由 k[2] 选择</text>

  <rect x="550" y="686" width="199" height="31" rx="4" fill="#eaf3f8" stroke="#26729c"/>
  <text x="649" y="707" class="small mono center">hf · 二级交换页</text>
  <rect x="764" y="686" width="211" height="31" rx="4" fill="#eef3f5" stroke="#667b84"/>
  <text x="869" y="707" class="small mono center">v · 9-trit interrupt requests</text>

  <!-- Operational unit -->
  <rect x="1025" y="185" width="565" height="548" rx="6" fill="#f8f5fa" stroke="#77558b" stroke-width="2"/>
  <text x="1307" y="216" class="section center" fill="#60446f">操作装置 OU</text>

  <rect x="1050" y="235" width="300" height="330" rx="5" fill="#ffffff" stroke="#77558b"/>
  <text x="1200" y="264" class="card-title center">RAM 页充当操作数栈</text>
  <text x="1200" y="287" class="small mono center">ph selects page · pa points to top</text>
  <rect x="1080" y="307" width="240" height="57" rx="4" fill="#77558b"/>
  <text x="1100" y="331" class="label inverse mono">T = mw[ph, pa]</text>
  <text x="1100" y="351" class="small inverse">栈顶 · 18-trit operand</text>
  <rect x="1080" y="374" width="240" height="57" rx="4" fill="#9b82aa"/>
  <text x="1100" y="398" class="label inverse mono">S = mw[ph, pa-1]</text>
  <text x="1100" y="418" class="small inverse">次栈顶 · 18-trit operand</text>
  <rect x="1080" y="441" width="240" height="36" fill="#eee8f2" stroke="#9b82aa"/>
  <text x="1200" y="465" class="body center">… 更深的 18-trit 项 …</text>
  <rect x="1080" y="487" width="240" height="36" fill="#eee8f2" stroke="#9b82aa"/>
  <text x="1200" y="511" class="body center">一页可放 27 个 18-trit 项</text>
  <text x="1200" y="546" class="small center">mw 是同一 RAM 的 18-trit 字视图；栈不另设 RAM</text>

  <rect x="1375" y="235" width="190" height="204" rx="5" fill="#fff8e8" stroke="#b57a1f" stroke-width="2"/>
  <text x="1470" y="265" class="card-title center" fill="#8d5a12">算术 / 操作路径</text>
  <rect x="1400" y="285" width="140" height="50" rx="4" fill="#b57a1f"/>
  <text x="1470" y="316" class="label inverse center">ALU operations</text>
  <text x="1400" y="363" class="body mono">e · 6 trits</text>
  <text x="1400" y="389" class="body mono">R · 18 trits</text>
  <text x="1400" y="415" class="body mono">Y · 18 trits</text>

  <rect x="1375" y="457" width="190" height="108" rx="5" fill="#ffffff" stroke="#77558b"/>
  <text x="1470" y="485" class="label center">基本栈动作</text>
  <text x="1470" y="510" class="small center">读 T / S → 运算</text>
  <text x="1470" y="532" class="small center">写结果 → 调整 pa</text>
  <text x="1470" y="551" class="small center">必要时访问 e / R / Y</text>

  <rect x="1050" y="588" width="515" height="120" rx="5" fill="#263b44"/>
  <text x="1075" y="617" class="label inverse">一条当前 tryte 的两条主路径</text>
  <text x="1075" y="646" class="small inverse mono">00 operation : T / S → operation → stack result</text>
  <text x="1075" y="673" class="small inverse mono">non-00 reference : page=h[k2], cell=k[3:6] → m → push 1–3 trytes</text>
  <text x="1075" y="696" class="small inverse">k[1] 参与确定引用长度；具体编码按历史指令说明解释</text>

  <!-- Internal information-flow arrows -->
  <line x1="525" y1="213" x2="460" y2="213" stroke="#b54c34" stroke-width="2.5" marker-end="url(#proto-control)"/>
  <text x="492" y="202" class="small center">ch + ca</text>
  <line x1="460" y1="249" x2="525" y2="249" stroke="#26729c" stroke-width="2.5" marker-end="url(#proto-data)"/>
  <text x="492" y="267" class="small center">6-trit → k</text>
  <line x1="525" y1="642" x2="460" y2="642" stroke="#3f7e59" stroke-width="2.5" marker-end="url(#proto-arrow)"/>
  <text x="492" y="629" class="small center">h : k</text>
  <line x1="975" y1="548" x2="1050" y2="548" stroke="#b54c34" stroke-width="2.5" marker-end="url(#proto-control)"/>
  <text x="1012" y="536" class="small center">ph / pa</text>
  <path d="M 975 285 H 1012 V 175 H 1470 V 285" fill="none" stroke="#b54c34" stroke-width="2.5" marker-end="url(#proto-control)"/>
  <rect x="1160" y="166" width="160" height="19" fill="#fcfaf5"/>
  <text x="1240" y="181" class="small center">operation dispatch</text>
  <path d="M 460 704 H 482 V 740 H 1012 V 523 H 1050" fill="none" stroke="#26729c" stroke-width="2.5" marker-end="url(#proto-data)"/>
  <text x="745" y="737" class="small center">reference read: 6 / 12 / 18 trits → operand stack</text>
  <line x1="1350" y1="372" x2="1375" y2="372" stroke="#77558b" stroke-width="2.5" marker-end="url(#proto-arrow)"/>
  <line x1="1375" y1="405" x2="1350" y2="405" stroke="#77558b" stroke-width="2.5" marker-end="url(#proto-arrow)"/>

  <!-- Second-level storage -->
  <rect x="45" y="806" width="475" height="224" rx="6" fill="#f7fbfd" stroke="#26729c" stroke-width="2"/>
  <text x="282" y="838" class="section center" fill="#195c7f">二级存储器 f</text>
  <rect x="70" y="857" width="205" height="111" rx="5" fill="#dceef6" stroke="#26729c" stroke-width="3"/>
  <text x="172" y="884" class="card-title center">f1 · 原型实装</text>
  <text x="172" y="913" class="body center">磁鼓 · 243 pages</text>
  <text x="172" y="939" class="small mono center">q1 · 8-trit page number</text>
  <text x="172" y="958" class="small center">与 m 按整页交换</text>
  <rect x="292" y="857" width="203" height="111" rx="5" fill="#ffffff" stroke="#667b84" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="393" y="884" class="card-title center">f2 / f3 · 预留</text>
  <text x="393" y="913" class="body center">可扩展的页式存储组</text>
  <text x="393" y="939" class="small mono center">q2 / q3 · 8 trits</text>
  <text x="282" y="1007" class="small center">hf 选择 m 中参与交换的内部页</text>
  <line x1="252" y1="806" x2="252" y2="758" stroke="#26729c" stroke-width="2.5" marker-start="url(#proto-data)" marker-end="url(#proto-data)"/>
  <text x="267" y="786" class="small">bidirectional page transfer</text>

  <!-- I/O -->
  <rect x="550" y="806" width="535" height="224" rx="6" fill="#f4faf6" stroke="#3f7e59" stroke-width="2"/>
  <text x="817" y="838" class="section center" fill="#2f6848">三路输入 / 输出通道</text>
  <rect x="575" y="857" width="145" height="81" rx="5" fill="#ffffff" stroke="#3f7e59"/>
  <rect x="745" y="857" width="145" height="81" rx="5" fill="#ffffff" stroke="#3f7e59"/>
  <rect x="915" y="857" width="145" height="81" rx="5" fill="#ffffff" stroke="#3f7e59"/>
  <text x="647" y="882" class="label mono center">channel 1</text>
  <text x="817" y="882" class="label mono center">channel 2</text>
  <text x="987" y="882" class="label mono center">channel 3</text>
  <text x="647" y="905" class="small mono center">u1 + sync</text>
  <text x="817" y="905" class="small mono center">u2 + sync</text>
  <text x="987" y="905" class="small mono center">u3 + sync</text>
  <text x="647" y="927" class="small center">g1 · 7-bit binary</text>
  <text x="817" y="927" class="small center">g2 · 7-bit binary</text>
  <text x="987" y="927" class="small center">g3 · 7-bit binary</text>
  <text x="817" y="960" class="body center">原型设备：Consul-254 打字机 · 光电纸带读入机 · PERFOM-30</text>
  <text x="817" y="985" class="small center">g_i 是 7-bit binary 信息寄存器；通道完成二进制 / 三进制转换</text>
  <text x="817" y="1008" class="small center">体系最多连接 24 台设备；通道可向 m 读写，v 向控制装置报告中断请求</text>
  <line x1="760" y1="806" x2="760" y2="758" stroke="#3f7e59" stroke-width="2.5" marker-start="url(#proto-arrow)" marker-end="url(#proto-arrow)"/>
  <text x="773" y="786" class="small mono">u_i / g_i</text>
  <circle cx="870" cy="740" r="5" fill="#ffffff"/>
  <line x1="870" y1="806" x2="870" y2="717" stroke="#667b84" stroke-width="2.5" marker-end="url(#proto-arrow)"/>
  <text x="884" y="786" class="small mono">v interrupt</text>

  <!-- Reading key -->
  <rect x="1115" y="806" width="500" height="224" rx="6" fill="#fff8e8" stroke="#b57a1f" stroke-width="2"/>
  <text x="1365" y="838" class="section center" fill="#8d5a12">怎样读这张图</text>
  <circle cx="1147" cy="876" r="16" fill="#b54c34"/>
  <text x="1147" y="882" class="label inverse center">1</text>
  <text x="1175" y="881" class="body">ch + ca 从 m 取出当前 6-trit tryte 到 k</text>
  <circle cx="1147" cy="917" r="16" fill="#b57a1f"/>
  <text x="1147" y="923" class="label inverse center">2</text>
  <text x="1175" y="922" class="body">k 分流：操作作用于 T/S；引用由 h 选页、k[3:6] 选页内地址</text>
  <circle cx="1147" cy="958" r="16" fill="#77558b"/>
  <text x="1147" y="964" class="label inverse center">3</text>
  <text x="1175" y="963" class="body">ph + pa 把 RAM 页解释为 27 深的 18-trit 栈</text>
  <circle cx="1147" cy="999" r="16" fill="#26729c"/>
  <text x="1147" y="1005" class="label inverse center">4</text>
  <text x="1175" y="1004" class="body">f 与 I/O 也围绕 m 交换页或 tryte，并可触发中断</text>

  <rect x="45" y="1050" width="1570" height="55" rx="5" fill="#263b44"/>
  <text x="830" y="1074" class="label inverse center">史料确认：9 页 RAM + 18 页 ROM；每页 81 trytes；RAM 页作 27 × 18-trit 操作数栈；c[1:8]/cb/cc 为 8/12/12-trit 三段。</text>
  <text x="830" y="1094" class="small inverse center">这是架构功能重绘，不是逐线电气原理图；原型实装 f1 磁鼓和三路 I/O，f2 / f3 为体系预留。</text>
</svg>
